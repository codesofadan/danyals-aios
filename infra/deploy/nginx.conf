# AIOS — nginx server block for the Dockerized (Portainer) stack.
#
# Mounted read-only into the jonasal/nginx-certbot container at
# /etc/nginx/user_conf.d/app.conf. That image parses `server_name` + the
# `ssl_certificate .../live/<domain>/...` path below to know which cert to
# request from Let's Encrypt, drops in a dummy cert on first boot so nginx
# starts, then swaps in the real cert and auto-renews it.
#
# DO NOT add a `listen 80` block here — the image already serves the ACME
# http-01 challenge and redirects http→https for you. This file is HTTPS only.
#
# `web` is the Next.js container on the compose network; it proxies /api/v1/*
# to api:8000, so this single upstream fronts the whole app. Keep the domain
# here in sync with TRUSTED_HOSTS / API_CORS_ORIGINS in the stack env.

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         app.qanry.com;

    # Managed by the container's integrated certbot (dummy first, then real).
    ssl_certificate         /etc/letsencrypt/live/app.qanry.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/app.qanry.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.qanry.com/chain.pem;

    # Big multipart uploads (data-import) + streamed PDF/deliverable downloads.
    client_max_body_size 100m;

    # Baseline security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # DENY, not SAMEORIGIN: nothing in this product frames the API, and the
    # dashboard's own policy sets frame-ancestors 'none' for the same reason.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # NO Content-Security-Policy is set here, deliberately.
    #
    # This server block fronts `app.qanry.com` - the DASHBOARD (the Next.js `web`
    # container, which proxies /api/v1/* onward to api:8000). Next.js emits the
    # application CSP itself (frontend/next.config.mjs), so it already covers
    # every response that passes through here, in every deployment topology.
    #
    # Adding one here would be actively harmful. nginx's `add_header` does NOT
    # replace an upstream header of the same name - it appends a SECOND one, and
    # a browser enforces the INTERSECTION of all CSP headers it receives. A
    # restrictive policy added at this layer would therefore silently subtract
    # from the app's own policy (e.g. an API-style `default-src 'none'` would
    # strip the dashboard's scripts, styles and fonts) with no way for the app to
    # win it back. Keep the policy in exactly one place: the app.
    #
    # The API-ORIGIN policy lives in infra/deploy/Caddyfile, which fronts the
    # api.* host - and it is set there with Caddy's `?` (set-only-if-absent)
    # prefix so the audit report.html route's own narrower policy still applies.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://web:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / upgrade support (Next.js runtime + any live features).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long jobs / large downloads shouldn't be cut off mid-stream.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }
}
