    - { url: "sample-roundrock-climate-hallway.jpg", caption: "Round Rock climate corridor, unit numbers visible [SAMPLE]", geotag: "Round Rock, TX", date: "2026-06" }
  reviews:
    - { platform: "Google", count: 214, rating: 4.7, profile_url: "https://maps.google.com/anchor-roundrock.example" }   # [SAMPLE]
    - { platform: "Google", count: 168, rating: 4.6, profile_url: "https://maps.google.com/anchor-pflugerville.example" }   # [SAMPLE]

# --- Voice ---
voice:
  one_line_direction: "Plain, local, owner-present. Sounds like Dana at the counter: facts, gate hours, dollar amounts, no corporate polish."
  reading_level: "Grade 6-7"
  tone_by_context:
    pricing: "matter-of-fact, fees stated up front"
    security: "specific mechanisms, never 'safe and secure'"
    size: "rooms and boxes, direct-answer first"
  banned_phrases: ["peace of mind", "safe and secure", "space solutions", "storage made easy", "your belongings are safe", "state-of-the-art"]
  good_examples:
    - "A 10x10 holds a one-bedroom apartment: bed, sofa, dresser, and about 100 boxes. Not sure? Most people size up one step."
    - "Gate access is 6am to 10pm daily, with a code that logs every entry and exit. 28 cameras, recorded around the clock."
  off_brand_examples:
    - "Anchor Self Storage offers premier space solutions with the peace of mind that your belongings are safe and secure."
    - "Our state-of-the-art facility keeps your treasured possessions protected."

guardrails:
  banned_competitor_mentions: []
  compliance_notes: "Self-storage overlay applies. Protection plan is NOT insurance (SS-1): never say insurance/coverage/policy for it. No absolute-security claim (SS-3); use the real camera/gate/alarm specs. Disclose the $25 admin fee in-line with 'first month free' (SS-6). No 'rate locked' (SS-8; ECRI applies). No ADA-accessible claim (ada_verified is false, SS-12). Any lien/auction timeline must trace to TX Property Code ch. 59 (SS-11)."
  review_pii_rule: "Never publish a reviewer's full name or identifying detail without consent."

vertical: "self-storage"        # the overlay filename token (knowledge/verticals/self-storage.md)
trade_is_ymyl: false            # self-storage is not YMYL; the overlay is still mandatory

case_log: []
