# --- Voice ---
voice:
  one_line_direction: "Warm, plain-spoken, reassuring clinician who respects the reader's intelligence and their nerves. Explains, does not hype."
  reading_level: "Grade 7-8"
  tone_by_context:
    pricing: "transparent and matter-of-fact"
    procedure: "calm, step-by-step, honest about what to expect"
    emergency: "fast and steadying"
  banned_phrases: ["painless", "guaranteed", "#1", "best in LA", "perfect smile", "world-class", "state-of-the-art"]
  good_examples:
    - "An implant is a small titanium post that takes the place of the tooth root, so the new tooth is anchored the way a real one is."
    - "Most patients tell us the procedure was easier than the toothache that brought them in."
  off_brand_examples:
    - "Transform your smile with our world-class, painless, guaranteed implant solutions!"
    - "We are the #1 trusted implant experts for all your dental needs."

