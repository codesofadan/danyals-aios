name: frontend-ci

# The dashboard had NO automated check of any kind: no test runner, no typecheck
# in CI, no build gate. It was also the only part of the system the Phase-2 audit
# could fully verify by running it — `npm ci` -> `tsc --noEmit` -> `next build` all
# passed. This job locks that in so it keeps passing, at zero cost to write.
#
# Blocking on purpose. A dashboard that does not compile is not a smaller problem
# than a backend that does not import.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the runtime the Dockerfile builds against.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`): installs the lockfile exactly and fails if
      # package.json and the lock have drifted. The backend has no equivalent
      # lock today — see docs/implementation/TEST_BASELINE.md risk R-B1.
      - name: Install
        run: npm ci

      # Lint runs BEFORE the typecheck because it is the cheaper gate and it catches a
      # different class: the App Router server/client boundary, hook dependency arrays,
      # and dead code that compiles perfectly well. Until 2026-08-24 this step could not
      # exist — `npm run lint` ran the deprecated `next lint`, which with no config
      # present drops into an INTERACTIVE PROMPT and would hang this job rather than
      # fail it. `frontend/eslint.config.mjs` replaces that.
      #
      # `--max-warnings` is deliberately NOT zero. The dashboard is ~27k lines written
      # without a linter and carries 18 known warnings, each a real finding recorded in
      # the commit that introduced this step. Failing on them today would mean
      # suppressing them wholesale, which looks like coverage and is not. The number is
      # a RATCHET: it may go down, never up.
      - name: Lint
        run: npx eslint . --max-warnings 18

      - name: Typecheck
        run: npx tsc --noEmit

      # Until 2026-08-24 the dashboard had NO test runner at all — this job ran a
      # typecheck and a build, which prove the code COMPILES and nothing more. Neither
      # can tell you whether a component renders what it claims to, or whether it
      # renders something it must not.
      - name: Test
        run: npx vitest run

      # The build is a real gate, not a duplicate of the typecheck: it catches
      # what `tsc` cannot — a bad `next.config.mjs`, a server/client boundary
      # violation, a missing font or static asset, a prerender-time crash.
      # No backend runs in this job, and none is needed: every screen fetches
      # client-side through `lib/api.ts`, so a clean build is itself the proof
      # that nothing reaches for the API at build time. The env is left at its
      # production defaults (`NEXT_PUBLIC_API_BASE_URL` = the relative `/api/v1`)
      # so CI builds the same artefact the Dockerfile does.
      - name: Build
        run: npx next build
