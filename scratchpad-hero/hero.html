<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{
    width:1200px;height:630px;position:relative;
    background:
      radial-gradient(900px 500px at 82% -12%, rgba(255,255,255,.18), transparent 60%),
      radial-gradient(700px 520px at 8% 120%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(135deg,#4f46e5 0%,#6366f1 46%,#4338ca 100%);
    color:#fff;font-family:'Inter',system-ui,'Segoe UI',sans-serif;
    padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between;
  }
  /* faint dot grid */
  .card::before{
    content:"";position:absolute;inset:0;opacity:.16;
    background-image:radial-gradient(rgba(255,255,255,.7) 1.5px, transparent 1.6px);
    background-size:34px 34px;mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);
  }
  .top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;letter-spacing:.14em;
    text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.30);
    padding:11px 22px;border-radius:999px;backdrop-filter:blur(2px);
  }
  .badge{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;
    display:flex;align-items:center;gap:12px;opacity:.95;
  }
  .badge .dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.18)}
  h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;line-height:1.02;
    letter-spacing:-.02em;position:relative;z-index:2;max-width:15ch;
    text-shadow:0 2px 24px rgba(30,27,75,.28);
  }
  h1 .hl{color:#e0e7ff}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:2}
  .sub{font-size:26px;font-weight:500;color:rgba(255,255,255,.92);max-width:44ch;line-height:1.35}
  .brand{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.01em;
    display:flex;align-items:center;gap:14px;white-space:nowrap;
  }
  .brand .mk{
    width:44px;height:44px;border-radius:12px;background:#fff;color:#4f46e5;
    display:grid;place-items:center;font-size:26px;font-weight:800;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="eyebrow">AI &times; SEO &middot; 2026</span>
      <span class="badge"><span class="dot"></span> Agency Playbook</span>
    </div>
    <h1>Best AI Agents for <span class="hl">SEO Agencies</span> in 2026</h1>
    <div class="bottom">
      <div class="sub">Agentic platforms, GEO/AI&#8209;search visibility, and the stack that wins without risking client sites.</div>
      <div class="brand"><span class="mk">S</span> spotino</div>
    </div>
  </div>
</body>
</html>
