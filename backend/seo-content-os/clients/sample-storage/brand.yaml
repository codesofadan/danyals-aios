  - "Vehicle, RV and boat storage"
  - "Business and inventory storage"
  - "Student storage"

service_areas: ["Round Rock", "Pflugerville", "Hutto", "Georgetown", "Wells Branch"]
primary_city: "Round Rock"      # anchor city (main NAP line); in service_areas

# --- Self-storage specifics ---
storage:
  operator_type: "multi_facility"
  unit_sizes: ["5x5", "5x10", "10x10", "10x15", "10x20"]
  storage_types: ["climate-controlled", "drive-up", "vehicle", "business"]
  audiences: ["student", "business"]
  live_inventory: true          # [SAMPLE] the site feeds live per-unit price + availability from the PMS
  access_hours: "6am-10pm daily"
  office_hours: "Mon-Fri 9am-6pm, Sat 9am-5pm, closed Sunday"
  gate_access_24h: false
  climate_control:
    offered: true
    temp_range_f: "55-80"       # [SAMPLE] the real held range from the thermostat
    humidity_control: true      # [SAMPLE] HVAC + dehumidifiers, not temperature only -> moisture copy is permitted (SS-5)
  security_features:
    - { feature: cameras, spec: "28 HD cameras, recorded 24/7, footage stored 90 days", source: SME }
    - { feature: gate, spec: "gated keypad entry with a per-tenant code logged on entry and exit", source: SME }
    - { feature: alarms, spec: "individually alarmed climate units", source: SME }
    - { feature: lighting, spec: "motion-activated LED lighting in every interior hallway", source: SME }
    - { feature: manager, spec: "on-site manager Tue-Sat, daily aisle walk", source: SME }
  break_in_free_since: "2021-03-14"   # [SAMPLE] a real tracked start date; rendered as a dated counter, never invented
  move_in_special:
    offer: "first month free"
    admin_fee: "$25"            # [SAMPLE] still due at move-in; disclosed in-line with the "free" claim (SS-6)
    required_add_ons: "a protection plan or proof of your own renters/homeowners coverage"
    end_date: ""               # a standing offer, no fixed end date
  admin_fee: "$25"
  deposit_required: false
  month_to_month: true
  tenant_protection_type: "protection_plan"   # a self-indemnity plan -> may NEVER be called "insurance" (SS-1)
  insurance_license: {}         # not held; the facility sells a protection plan, not licensed insurance
  rate_guarantee: ""            # standard month-to-month, ECRI applies -> NO "rate locked" claim (SS-8)
  advertised_late_fee: ""       # not advertised in copy (TX uses a "reasonable" standard; confirm live if quoted)
  lien_statute: "TX Property Code ch. 59"   # any auction/lien-timeline copy must trace here (14-day notice, 2 weekly publications)
  ada_verified: false           # NOT verified -> no "ADA compliant / wheelchair accessible" claim may ship (SS-12)
  manager: { name: "Dana Reyes [SAMPLE]", title: "Facility Manager", cssm: true, cssm_date: "2023-09", detail: "manages the Round Rock flagship; grew up in Hutto" }

