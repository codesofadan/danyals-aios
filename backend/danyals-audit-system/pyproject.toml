[project]
name = "seo-audit-os"
version = "0.1.0"
description = "Multi-agent SEO audit system for local SEO agencies, run as a Claude Code slash command"
authors = [
    { name = "AIOS", email = "business.zainsaeed@gmail.com" }
]
requires-python = ">=3.11"
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
    "httpx[http2]>=0.27",
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
    "tenacity>=8.5",
    "typer>=0.12",
    "jinja2>=3.1",
    # NOT optional, despite `config.py` importing it in a try/except. It is how the
    # engine reads its OWN `.env`, and therefore how it gets EVERY API key.
    #
    # It was never declared, so it was absent from this venv - and the swallowed
    # ImportError meant nothing said so. `get_keys()` returned all-None, `--mode paid`
    # silently disabled `--serper/--psi/--places`, and the run recorded
    # `permitted_cost_classes: ['zero']`. Every billable check was then correctly
    # reported `source_not_permitted` - which is 71 of 71 off-page checks and 33 of 36
    # local ones, because those two dimensions are entirely billable. Both read
    # "Not measured" on every audit the platform has ever produced.
    "python-dotenv>=1.0",
    # Report page-cap safety net: bundle.py truncates report.pdf to the tier
    # ceiling (<=100 paid / <=20 free) if it ever renders past it. Pure-wheel,
    # no system libraries. The absence of it is handled gracefully (the net
    # simply no-ops), but shipping it makes the hard cap live in production.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
crawl = [
    "playwright>=1.43",
    "firecrawl-py>=0.0.16",
]
reports = [
    "weasyprint>=62",
    "markdown>=3.6",
    "pygments>=2.18",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
seo-audit = "audit_engine.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit_engine"]

[tool.hatch.build.targets.wheel.force-include]
"checklists" = "checklists"
"templates" = "templates"
"knowledge" = "knowledge"
"branding.json" = "branding.json"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast pure-Python tests",
    "integration: tests that hit local files or fixtures",
    "live_api: tests that hit live external APIs (skipped by default)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
