[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aios-backend"
version = "0.1.0"
description = "AIOS platform backend - FastAPI API + Celery workers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AIOS" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "httpx[http2]>=0.27",
    "tenacity>=8.5",
    "celery[redis]>=5.4",
    # Cap <7: redis 7.x/8.x drive a pathological pip-resolver backtrack against
    # celery/kombu (walks redis 8.x->6.x on every clean install), which hangs/fails
    # the Docker build. 6.x is the highest celery+kombu resolve to; pin it so the
    # build is deterministic and fast.
    "redis[hiredis]>=5.0,<7",
    "sentry-sdk[fastapi]>=2.8",
    "pyjwt[crypto]>=2.9",      # sign + verify our own EdDSA (Ed25519) access tokens
    "email-validator>=2.1",    # pydantic EmailStr for user provisioning
    "prometheus-client>=0.20",  # request-rate / latency / in-flight metrics at /metrics
    "psycopg[binary,pool]>=3.2",  # local-Postgres driver + connection pool (RLS + privileged seams)
    "argon2-cffi>=23.1",       # Argon2id password hashing for local auth (verifies imported bcrypt too)
    "cryptography>=43.0",      # app-layer AES-256-GCM vault sealing (master key never in Postgres)
    "python-multipart>=0.0.9",  # multipart/form-data parsing - FastAPI needs it for the data-import upload
    "openpyxl>=3.1",           # streaming (read_only) XLSX reader for the data-import worker
]

[project.optional-dependencies]
# Context AI provider SDKs (P6B). Kept OUT of the core runtime deps so the base
# install + gate stay light: the seams lazy-import these and the unit suite runs
# on deterministic fakes. Install with `pip install -e .[ai]` + set the keys to
# activate the real Summarizer / Embedder / VectorStore.
ai = [
    "anthropic>=0.40",   # Summarizer (Claude Haiku/Sonnet); lazy-imported. This is
                         # the only provider SDK the image needs — the content writer,
                         # ai-assist, and context summarizer all use it.
]
# Vector store SDKs (Embedder + VectorStore). SPLIT OUT of `ai` and OUT of the default
# image: the deployment uses NO Voyage/Pinecone (context vector recall is off), and this
# tree (voyageai -> langchain/tokenizers/huggingface, plus pinecone) is both heavy and a
# major contributor to pip-resolver backtracking. The seams lazy-import these and degrade
# to deterministic fakes when absent, so omitting them is safe. Install `.[ai,embeddings]`
# only if the Pinecone/Voyage vector store is ever activated.
embeddings = [
    "voyageai>=0.2",     # Embedder (Voyage AI - Anthropic has NO embeddings API)
    "pinecone>=5",       # VectorStore (Pinecone; namespaced per entity)
]
# 7B-4: the self-hosted citation-submission bot. Kept OUT of the core runtime deps
# (a headless-Chromium download is heavy and this only ever runs inside the
# citation_submit_job worker, never the FastAPI request path) - integrations/
# citation_bot.py lazy-imports it and degrades to None without it. Install with
# `pip install -e .[automation]` THEN `playwright install chromium` (the Python
# package alone does not ship the browser binary) to activate bot_fillable/
# captcha_assisted citation submits.
automation = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "asgi-lifespan>=2.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "psycopg[binary]>=3.2",   # RLS gate + local-Postgres integration tests
]

[tool.hatch.build.targets.wheel]
packages = ["app", "workers", "integrations"]

# The SEO-CONTENT-OS doctrine corpus (R6-1). NOT a Python package, so `packages`
# cannot carry it - force-include puts it beside app/ in site-packages, which is what
# lets `Path(app.__file__).parents[1] / "seo-content-os"` resolve BOTH from a source
# checkout and from the installed wheel in the Docker image.
#
# This matters more than it looks: the app runs from the venv (see backend/Dockerfile -
# only db/migrations and the audit engine are COPYied into the runtime stage), so a
# corpus left out of the wheel is present in every test run and absent in production.
# The failure would surface only inside the Celery worker, as a FileNotFoundError on a
# real client's content job.
[tool.hatch.build.targets.wheel.force-include]
"seo-content-os" = "seo-content-os"

[tool.ruff]
line-length = 110
target-version = "py311"
# VENDORED, not ours. `seo-content-os/` is the imported SEO doctrine corpus and its
# helper scripts; 447 of the 471 lint errors in this repo were in that one
# directory, which made `ruff check .` - the documented commit gate - permanently
# red and therefore ignored. A gate nobody can pass is a gate nobody reads. Lint
# the platform's own source; the corpus is third-party content that travels as-is.
extend-exclude = ["seo-content-os"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external services",
    "integration: tests that require Redis and/or local Postgres",
]
