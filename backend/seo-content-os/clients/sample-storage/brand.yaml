schema:
  local_business_type: "SelfStorage"            # the schema.org subtype (NOT bare LocalBusiness)
  price_range: "$29-$249/mo"
  opening_hours: ["Mo-Fr 09:00-18:00", "Sa 09:00-17:00"]   # OFFICE hours; gate access is separate (storage.access_hours)
