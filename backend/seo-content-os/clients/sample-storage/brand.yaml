# --- E-E-A-T assets (SAMPLE; production values from the SME interview). ---
eeat:
  credentials:
    - "Facility manager Dana Reyes is a Certified Self Storage Manager (CSSM, SSA), certified 2023-09 [SAMPLE]"
    - "Member, Texas Self Storage Association [SAMPLE]"
  team:
    - { name: "Dana Reyes [SAMPLE]", role: "Facility Manager, Round Rock", years: 6, detail: "CSSM; runs the daily aisle walk and checks the climate thermostats each Monday" }
