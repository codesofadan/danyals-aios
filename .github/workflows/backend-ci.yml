name: backend-ci

# Monorepo hygiene: this git root also holds the audit engine, so only run when
# the backend (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app workers
      - name: Unit tests + coverage
        run: pytest -m "not integration" --cov=app --cov=workers --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aios_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # Post-Supabase (P6A): the DB-backed integration suites - the RLS role x
      # table x op correctness matrix (+ the auto-discovering pg_policies oracle),
      # the real-token route-contract suite, portal isolation, repo/SQL parity and
      # the vault round-trip - run against an EPHEMERAL local Postgres with the
      # migrations applied.
      #
      # THE DSNs MUST NAME THE REAL ROLES. `rls_connection` does NOT issue a
      # `SET ROLE`: the RLS pool applies row-level security because it LOGS IN as
      # `authenticated` (see app/db/database.py's module contract). Both DSNs
      # previously pointed at the `postgres` SUPERUSER, under a comment claiming
      # the pool "SETs ROLE authenticated per request" - which it does not. A
      # superuser BYPASSES RLS unconditionally, FORCE or not, so every tenant-
      # isolation proof in this job was running against a connection that could
      # see everything. Eleven tests failed as a result, and this job has been red.
      #
      # `authenticated` and `service_role` are created by migration 0000; their
      # passwords are set in the step below, after the migrations apply. Nothing
      # here is a real secret - the DB is created and dropped with the job.
      # Live-provider suites (Serper / Anthropic / Voyage / Pinecone /
      # audit-engine) still auto-skip since their keys are unset.
      DATABASE_URL: postgresql://authenticated:ci_authenticated_pw@localhost:5432/aios_test
      DATABASE_ADMIN_URL: postgresql://service_role:ci_service_role_pw@localhost:5432/aios_test
      # Superuser DSN for the migration step only (it must create roles/schemas).
      MIGRATION_DSN: postgresql://postgres:postgres@localhost:5432/aios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply migrations (0000 is the substrate; superuser owner = BYPASSRLS)
        run: |
          for f in ../db/migrations/*.sql; do
            echo "applying $f"
            psql "$MIGRATION_DSN" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Give the RLS roles a login password
        # 0000 creates `authenticated` and `service_role` with LOGIN but no
        # password, so the app's two pools cannot connect as them until this runs.
        # This is what makes the RLS proofs in this job real: the authenticated
        # pool is subject to row-level security, and service_role is BYPASSRLS.
        run: |
          psql "$MIGRATION_DSN" -v ON_ERROR_STOP=1 -c \
            "alter role authenticated with login password 'ci_authenticated_pw';"
          psql "$MIGRATION_DSN" -v ON_ERROR_STOP=1 -c \
            "alter role service_role with login password 'ci_service_role_pw';"

      - name: Prove RLS is actually in force for this job
        # A guard on the guard. If a future change points DATABASE_URL back at a
        # superuser, every isolation assertion below would pass VACUOUSLY (a
        # BYPASSRLS connection sees all rows and denies nothing). Fail here
        # instead, with a message that says why.
        run: |
          set -e
          bypass=$(psql "$DATABASE_URL" -tAc "select rolbypassrls from pg_roles where rolname = current_user")
          echo "RLS pool connects as: $(psql "$DATABASE_URL" -tAc 'select current_user') (bypassrls=$bypass)"
          if [ "$bypass" != "f" ]; then
            echo "::error::DATABASE_URL connects as a BYPASSRLS role. Every tenant-isolation test in this job would pass vacuously. Point it at the 'authenticated' role."
            exit 1
          fi
      - name: Mint an ephemeral EdDSA keypair + vault key (test-only, never a prod secret)
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          k = Ed25519PrivateKey.generate()
          priv = k.private_bytes(s.Encoding.PEM, s.PrivateFormat.PKCS8, s.NoEncryption()).decode().strip()
          pub = k.public_key().public_bytes(s.Encoding.PEM, s.PublicFormat.SubjectPublicKeyInfo).decode().strip()
          print("JWT_PRIVATE_KEY<<PEM_EOF"); print(priv); print("PEM_EOF")
          print("JWT_PUBLIC_KEY<<PEM_EOF"); print(pub); print("PEM_EOF")
          PY
          echo "VAULT_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      # The DB-, redis-, JWT- and vault-backed suites now all run in CI; the
      # live-provider suites still auto-skip (their keys are intentionally unset).
      - name: Integration tests
        run: pytest -m integration

  security:
    # Dependency-vulnerability + secret scanning. Advisory hardening: dependency
    # vulns fail the job (triage a false positive with pip-audit --ignore-vuln);
    # gitleaks scans the full history for committed secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan sees every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: pip-audit (dependency vulnerabilities)
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]" pip-audit
          python -m pip_audit --progress-spinner off
      - name: Secret scan (gitleaks)
        # Pinned CLI binary (no GITLEAKS_LICENSE needed, unlike the Action in orgs).
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  db-rls:
    # Apply every migration to a throwaway Postgres and fail if any application
    # table lacks FORCE row-level security. This is the RLS coverage gate.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aios_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply migrations (no shim; 0000 is the substrate)
        # Applied as the postgres SUPERUSER (BYPASSRLS) so the SECURITY DEFINER RLS
        # helpers own-by-a-bypassrls-role and do not recurse. 0000_local_platform
        # creates the auth schema/uid() + the anon/authenticated/service_role roles
        # that every later migration references - no Supabase shim needed.
        run: |
          for f in ../db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: RLS gate (script)
        run: python -m app.db.rls_check
      - name: RLS gate (pytest)
        run: pytest -m integration tests/integration/test_rls_gate.py
